<div id="meta-block">
  <form hx-put="/papers/{{ paper.id }}/meta"
        hx-target="#meta-block" hx-swap="outerHTML">
    <label>Title
      <input type="text" name="title" value="{{ paper.title or '' }}">
    </label>
    <label>Authors <small>(comma-separated, in order)</small>
      <input type="text" name="authors"
             value="{{ (paper.authors_json | authors_list) | join(', ') }}">
    </label>
    <label>Publication date <small>(YYYY-MM-DD, YYYY-MM, or YYYY)</small>
      <input type="text" name="publication_date"
             value="{{ paper.publication_date or '' }}">
    </label>
    <label>Source URL
      <input type="url" name="source_url" value="{{ paper.source_url or '' }}">
    </label>
    <label>Memo
      <textarea name="memo" rows="4">{{ paper.memo or '' }}</textarea>
    </label>
    <div class="actions-row">
      <button type="submit">Save</button>
      <button type="button" class="secondary"
              hx-get="/papers/{{ paper.id }}/meta"
              hx-target="#meta-block" hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</div>
